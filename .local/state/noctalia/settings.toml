    position = "bottom"
    radius = 14
    start = [ "launcher", "active_window", "spacer_3" ]

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "clock", "date", "spacer_6", "screenshot", "keyboard_layout", "nightlight" ]
        opacity = 1.0
        padding = 18.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g2"
        members = [ "cpu", "ram", "spacer_2", "media", "audio_visualizer", "cat" ]
        opacity = 1.0
        padding = 6.0
