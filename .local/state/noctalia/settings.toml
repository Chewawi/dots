[dock]
icon_size = 28
position = "right"
reserve_space = false
show_dots = true
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "HDMI-A-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [
    "yuuto/calculator",
    "thaer99ob/default-apps",
    "noctalia/kaomoji",
    "detluck/performance-plus",
    "radimous/prismlauncher-instances",
    "noctalia/wallhaven",
    "cleboost/zed-provider",
    "noctalia/mpvpaper",
    "noctalia/bongocat",
    "felipeartur/ai-usagebar",
    "yugaaank/better-clock",
    "dotnetrob/cat",
    "noctalia/umbriel-companion"
]

[shell]
clipboard_history_max_entries = 200
font_family = "Google Sans Flex 9pt Medium"
panel_anchor_bar = "default"
polkit_agent = true
settings_window_translucent = true
umbriel_audio_provider_enabled = true
umbriel_overview_type_to_launch_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [shell.window_switcher]
    mru = true

[theme]
pure_black_dark = true
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "gtk3", "gtk4", "helix", "kcolorscheme", "qt", "umbriel" ]
    community_ids = [
        "claude-code",
        "sonora",
        "zen-browser",
        "sable",
        "zapfast",
        "obsidian",
        "zed",
        "prismlauncher",
        "steam",
        "obs",
        "thunar",
        "starship"
    ]

[wallpaper.default]
