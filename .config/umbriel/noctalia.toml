[colors]
background = "#1e100dFF"
text_primary = "#f8dcd8FF"
text_muted = "#e3beb8FF"
accent_primary = "#ffb4a7FF"
accent_secondary = "#ffb4a7FF"
warning = "#f5bd58FF"
error = "#ffb4abFF"
insert_hint = "#f5bd5880"
backdrop = "#4b332fFF"

[colors.border]
focused = "#ffb4a7FF"
unfocused = "#4b332fFF"
outer = "#000000FF"

[colors.overview]
background_tint = "#00000088"
badge = "#ffb4a7FF"
workspace_background = "#000000FF"

[colors.tab_bar]
background = "#1e100dFF"
text = "#e3beb8FF"
active = "#ffb4a7FF"
active_text = "#680300FF"
active_unfocused = "#4b332fFF"
active_unfocused_text = "#f8dcd8FF"
urgent = "#ffb4abFF"
urgent_text = "#690005FF"

[colors.title_bar]
background = "#1e100dFF"
background_unfocused = "#000000FF"
text = "#f8dcd8FF"
text_unfocused = "#e3beb8FF"
close = "#ffb4abFF"
maximize = "#ffb4a7FF"
minimize = "#ffb4a7FF"

[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#f5bd58FF"
border_color_unfocused = "#956900FF"
